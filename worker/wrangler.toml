name = "photo-album-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
APP_URL = "http://localhost:4321"
API_URL = "http://localhost:8787"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "photo-album-dev"
remote = true

# Secrets go in worker/.dev.vars locally (see .dev.vars.example) and `wrangler secret put` in production.

[triggers]
crons = ["0 3 * * *"]
